name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check Worker syntax
        run: npm run check

      - name: Test
        run: npm test

      - name: Configure D1 binding
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node scripts/configure-d1.js

      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MISSKEY_WEBHOOK_SECRET: ${{ secrets.MISSKEY_WEBHOOK_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          printf '%s' "$MISSKEY_WEBHOOK_SECRET" | npx wrangler secret put MISSKEY_WEBHOOK_SECRET --name misskey-to-x
          printf '%s' "$X_API_KEY" | npx wrangler secret put X_API_KEY --name misskey-to-x
          printf '%s' "$X_API_KEY_SECRET" | npx wrangler secret put X_API_KEY_SECRET --name misskey-to-x
          printf '%s' "$X_ACCESS_TOKEN" | npx wrangler secret put X_ACCESS_TOKEN --name misskey-to-x
          printf '%s' "$X_ACCESS_TOKEN_SECRET" | npx wrangler secret put X_ACCESS_TOKEN_SECRET --name misskey-to-x

      - name: Apply D1 migration
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute misskey-to-x --remote --file=migrations/0001_init.sql

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
